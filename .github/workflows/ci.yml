name: Version 1.0 Local CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps --editable .
          python -m pip check
      - name: Validate imports and package compilation
        run: |
          python -c "import eo_event_platform; import eo_event_platform.api.app; import eo_event_platform.dashboard.app; import eo_event_platform.spark.schemas"
          python -m compileall -q src tests dags
      - name: Run complete integration-safe discovery
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run representative data-boundary tests
        run: |
          python -m unittest -v tests.unit.replay.test_generator tests.unit.replay.test_verify
          python -m unittest -v tests.unit.spark.test_schemas tests.unit.gold.test_build tests.unit.serving.test_postgres_loader
      - name: Audit secrets, generated data, and documentation links
        run: python tools/repository_audit.py

  container-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose contracts
        run: |
          EO_POSTGRES_PASSWORD=ci-placeholder EO_POSTGRES_HOST_PORT=55432 docker compose -f infrastructure/postgres/compose.postgres.yml config --quiet
          docker compose -f infrastructure/kafka/compose.kafka.yml config --quiet
      - name: Validate Dockerfile
        run: docker buildx build --check --file infrastructure/spark-kafka/Dockerfile infrastructure/spark-kafka
      - name: Prove generated scale data is not tracked
        run: |
          test -z "$(git ls-files 'data/local/**' 'data/generated/**' '*.parquet')"
